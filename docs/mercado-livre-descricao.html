<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oficina Pro Desktop — Texto Mercado Livre</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #1d4ed8;
        --accent-hover: #1e40af;
        --border: #e2e8f0;
        --ok: #166534;
        --cta: #ea580c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      .header {
        background: linear-gradient(135deg, #1e3a8a, #1d4ed8 55%, #ea580c);
        color: #fff;
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 20px;
      }
      .header h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      .header p {
        margin: 0;
        opacity: 0.92;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .note {
        color: var(--muted);
        font-size: 0.95rem;
        margin: 0 0 16px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-secondary {
        background: #dbeafe;
        color: var(--accent);
      }
      .status {
        min-height: 1.25rem;
        font-size: 0.9rem;
        color: var(--ok);
        margin-bottom: 12px;
      }
      textarea {
        width: 100%;
        min-height: 720px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--text);
        background: #fcfcfd;
      }
      .title-box {
        min-height: 72px;
      }
      .short {
        min-height: 120px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>Oficina Pro Desktop — Texto para Mercado Livre</h1>
        <p>Texto puro para colar no anúncio. Preço sugerido: R$ 99 a R$ 149.</p>
      </div>

      <div class="card">
        <h2>Título sugerido</h2>
        <div class="actions">
          <button class="btn-primary" type="button" data-copy-target="titulo">
            Copiar título
          </button>
        </div>
        <textarea id="titulo" class="title-box" readonly>
Oficina Pro Desktop - Sistema Oficina Mecânica OS Estoque Clientes Offline</textarea>
      </div>

      <div class="card">
        <h2>Resumo curto</h2>
        <div class="actions">
          <button class="btn-primary" type="button" data-copy-target="resumo">
            Copiar resumo
          </button>
        </div>
        <textarea id="resumo" class="short" readonly>
Oficina Pro Desktop - software para oficina mecânica com ordem de serviço, clientes, veículos, peças e estoque. 100% offline, pagamento único, sem mensalidade. Funciona em Windows, Mac e Linux.</textarea>
      </div>

      <div class="card">
        <h2>Descrição completa</h2>
        <div class="actions">
          <button class="btn-primary" type="button" id="copy-all">
            Copiar descrição completa
          </button>
          <button class="btn-secondary" type="button" id="select-all">
            Selecionar tudo
          </button>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
        <textarea id="descricao" readonly>
SISTEMA PARA OFICINA MECÂNICA COM ORDEM DE SERVIÇO, CLIENTES, VEÍCULOS E ESTOQUE

O Oficina Pro Desktop é um software instalado no computador para gerenciar a operação da sua oficina: ordens de serviço, clientes, veículos, peças e mão de obra.

Funciona 100% offline. Seus dados ficam no próprio computador. Não precisa de login na nuvem e não tem mensalidade.


PAGAMENTO ÚNICO, SEM MENSALIDADES


COMPATÍVEL COM

Windows 10 e 11: Sim
macOS Intel e Apple Silicon: Sim
Linux Ubuntu, Debian e derivados: Sim


PARA QUEM É

Oficinas mecânicas de carros e motos
Auto centers e pequenas retíficas
Quem quer sair da planilha e controlar OS de verdade
Quem precisa de estoque de peças com baixa automática na OS


O QUE VOCÊ CONSEGUE FAZER

Ordens de Serviço
- Abrir, acompanhar e fechar OS
- Status: aberta, em andamento, aguardando peças, concluída, fechada
- Reclamação, diagnóstico e km do veículo
- Peças + serviços na mesma OS
- Totais de mão de obra, peças, desconto e valor final
- Ao fechar a OS, o sistema baixa o estoque das peças usadas

Clientes e veículos
- Cadastro de clientes com telefone, e-mail e documento
- Veículos com placa, marca, modelo, ano, cor e odômetro
- Vínculo entre cliente e veículo

Catálogo e estoque
- Serviços de mão de obra com preço e tempo estimado
- Peças com SKU, código de barras, custo, preço e estoque mínimo
- Entrada, saída, ajuste e transferência entre locais

Relatórios e backup
- Indicadores de estoque
- Exportação de dados
- Dados locais no seu computador


PRINCIPAIS VANTAGENS

- Feito para oficina, não é só um PDV genérico
- Interface moderna e fácil de usar
- Offline de verdade
- Sem mensalidade
- Multiplataforma: Windows, Mac e Linux
- Baixa de estoque automática ao fechar a OS
- Várias oficinas no mesmo computador


O QUE VOCÊ RECEBE

Após a compra, informe o sistema operacional e receba o instalador:

Windows: instalador .exe
macOS: arquivo .dmg
Linux: AppImage ou .deb conforme disponibilidade

Inclui orientação de instalação e primeiros passos.


REQUISITOS

- 4 GB de RAM (recomendado 8 GB)
- Windows 10/11 64 bits, macOS 11+, ou Linux 64 bits com interface gráfica
- Espaço em disco para instalação


IMPORTANTE

- Sistema não fiscal: não emite NF-e / NFC-e
- Não envia dados para a Receita Federal
- Ideal para controle interno da oficina e comprovantes operacionais


PERGUNTAS FREQUENTES

Tem mensalidade?
Não. Pagamento único.

Funciona sem internet?
Sim. Depois de instalado, opera offline.

Serve para moto também?
Sim. O cadastro de veículos é genérico (placa, marca, modelo, km).

Baixa estoque sozinho?
Sim, ao fechar a OS com peças vinculadas.

Emite nota fiscal?
Não. É um sistema de gestão operacional, não fiscal.


COMECE HOJE

Organize clientes, veículos, OS e estoque em um único sistema offline, com visual moderno e foco no dia a dia da oficina.
</textarea>
      </div>
    </div>
    <script>
      function copyText(id) {
        const el = document.getElementById(id);
        el.select();
        document.execCommand("copy");
        const status = document.getElementById("status");
        status.textContent = "Copiado!";
        setTimeout(() => (status.textContent = ""), 1500);
      }
      document.querySelectorAll("[data-copy-target]").forEach((btn) => {
        btn.addEventListener("click", () =>
          copyText(btn.getAttribute("data-copy-target"))
        );
      });
      document
        .getElementById("copy-all")
        .addEventListener("click", () => copyText("descricao"));
      document.getElementById("select-all").addEventListener("click", () => {
        const el = document.getElementById("descricao");
        el.focus();
        el.select();
      });
    </script>
  </body>
</html>
